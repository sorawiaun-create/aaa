<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เชื่อมต่อ TikTok — Chobtham</title>
  <style>
    :root { --bg:#0b0b0f; --panel:#15151d; --border:#26262f; --text:#f2f2f5; --muted:#a0a0ad; --brand:#fe2c55; --brand2:#25f4ee; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", "Noto Sans Thai", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .box { max-width: 560px; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 32px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 20px; }
    .logo .mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--brand), #c9224a); display: grid; place-items: center; font-weight: 800; color: #fff; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
    .code { display: flex; gap: 8px; }
    .code input { flex: 1; background: #0b0b0f; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--brand2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
    button { border: none; border-radius: 10px; padding: 12px 18px; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--brand); color: #fff; white-space: nowrap; }
    button:hover { background: #e02549; }
    .steps { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
    .steps ol { padding-left: 20px; }
    .steps li { margin: 6px 0; }
    .error { color: #ff8080; }
    .ok { color: var(--brand2); font-size: 13px; margin-top: 8px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo"><span class="mark">C</span> Chobtham</div>
    <div id="content">
      <h1>กำลังอ่านรหัส…</h1>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("auth_code") || params.get("code");
      var content = document.getElementById("content");

      if (!code) {
        content.innerHTML =
          '<h1 class="error">ไม่พบ auth_code</h1>' +
          '<p class="sub">ดูเหมือนคุณเปิดหน้านี้โดยตรง กรุณาเริ่มจากปุ่ม “เปิดหน้าอนุญาต TikTok” ในหน้า Settings ของเครื่องมืออีกครั้ง</p>';
        return;
      }

      content.innerHTML =
        '<h1>เชื่อมต่อสำเร็จ! 🎉</h1>' +
        '<p class="sub">คัดลอกรหัสด้านล่าง แล้วนำไปวางในเครื่องมือ (Settings → ขั้นที่ 2)</p>' +
        '<div class="label">auth_code</div>' +
        '<div class="code"><input id="codeField" readonly value="' + code + '" />' +
        '<button id="copyBtn">คัดลอก</button></div>' +
        '<div class="ok" id="okMsg"></div>' +
        '<div class="steps"><ol>' +
        '<li>กดปุ่ม “คัดลอก”</li>' +
        '<li>กลับไปที่หน้า Settings ของเครื่องมือ</li>' +
        '<li>วางในช่อง “ขั้นที่ 2 — วาง auth_code” แล้วกด “เชื่อมต่อ”</li>' +
        '</ol><p style="margin-top:10px">⚠️ รหัสนี้ใช้ได้ครั้งเดียวและหมดอายุเร็ว ให้นำไปวางทันที</p></div>';

      var field = document.getElementById("codeField");
      var btn = document.getElementById("copyBtn");
      var ok = document.getElementById("okMsg");
      btn.addEventListener("click", function () {
        field.select();
        navigator.clipboard.writeText(field.value).then(function () {
          ok.textContent = "คัดลอกแล้ว ✓";
        }, function () {
          document.execCommand("copy");
          ok.textContent = "คัดลอกแล้ว ✓";
        });
      });
    })();
  </script>
</body>
</html>
