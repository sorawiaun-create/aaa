<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useRef } = React;

/* =========================================================================
   COD Checker — ตรวจสอบเงินเก็บปลายทาง (Cash on Delivery) ไม่ให้รั่วไหล
   -------------------------------------------------------------------------
   หลักการ: จับคู่ด้วย "เลขพัสดุ (Tracking No.)"
     ฝั่งซ้าย  = เงินที่ "ต้องได้"  (พัสดุ COD ที่ส่งออกไป + สถานะ)
     ฝั่งขวา   = เงินที่ "เข้าจริง" (ยอดโอน COD ที่ขนส่งจ่ายกลับมา)
   แล้ว reconcile ทีละพัสดุ เพื่อจับทุกจุดที่เงินรั่ว:
     • ส่งสำเร็จแล้วแต่เงินยังไม่เข้า (รอเงิน / เกินกำหนด)
     • เงินเข้าไม่ครบ (ขาด) / เงินเข้าเกิน
     • พัสดุตีกลับแต่มีเงินเข้า (ผิดปกติ)
     • เงินเข้ามาแต่ไม่มีออเดอร์ (หาที่มาไม่ได้)
     • เลขพัสดุซ้ำ
   ========================================================================= */

// ---------- utils ----------
const fmtBaht = (n) => new Intl.NumberFormat('th-TH', { style:'currency', currency:'THB', minimumFractionDigits:2 }).format(Number(n)||0);
const fmtNum  = (n) => new Intl.NumberFormat('th-TH').format(Number(n)||0);
const clsx = (...a) => a.filter(Boolean).join(' ');

const parseNum = (v) => {
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return v;
  const s = String(v).replace(/[฿,\s]/g, '').replace(/บาท/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};

// รับได้หลายรูปแบบ: dd/mm/yyyy, yyyy-mm-dd, ISO, dd-mm-yyyy
const parseDate = (v) => {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
  if (m) { let y=+m[3]; if (y>2400) y-=543; return new Date(y, +m[2]-1, +m[1]); } // รองรับ พ.ศ.
  const d = new Date(s);
  return isNaN(d) ? null : d;
};
const daysSince = (v) => {
  const d = parseDate(v); if (!d) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
};

// ---------- CSV parser (รองรับ quote / คอมมาในเซลล์ / ขึ้นบรรทัดใหม่) ----------
function parseCSV(text) {
  const rows = []; let row = [], field = '', i = 0, q = false;
  text = text.replace(/^﻿/, ''); // ตัด BOM
  while (i < text.length) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { field+='"'; i+=2; continue; } q=false; i++; continue; }
      field += c; i++; continue;
    }
    if (c === '"') { q=true; i++; continue; }
    if (c === ',') { row.push(field); field=''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field += c; i++;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(c => String(c).trim() !== ''))
    .map(r => Object.fromEntries(headers.map((h, idx) => [h, r[idx] ?? ''])));
}

// แปลง text (auto: JSON หรือ CSV) เป็น array ของ object
function parseAny(text) {
  const t = text.trim();
  if (!t) return [];
  if (t[0] === '[' || t[0] === '{') {
    const j = JSON.parse(t);
    if (Array.isArray(j)) return j;
    // เผื่อ API ห่อ array ไว้ในฟิลด์
    for (const k of ['data','result','results','items','list','records','rows']) {
      if (Array.isArray(j[k])) return j[k];
    }
    return [j];
  }
  return parseCSV(t);
}

// ดึง array จาก JSON ตาม path เช่น "data.items"
function getByPath(obj, path) {
  if (!path) return obj;
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}

// ---------- auto-mapping: เดาว่าคอลัมน์ไหนคืออะไร ----------
const SYNONYMS = {
  tracking:  ['tracking','trackingno','trackingnumber','track','awb','waybill','waybillno','barcode','conno','pno','parcel','spxtn','sortcode','เลขพัสดุ','เลขติดตาม','เลขแทรค','พัสดุ','หมายเลขพัสดุ'],
  carrier:   ['carrier','express','courier','shippingchannel','channel','logistic','logistics','provider','ขนส่ง','บริษัทขนส่ง','ช่องทางขนส่ง'],
  codAmount: ['cod','codamount','codvalue','codfee','codcharge','goodsamount','orderamount','totalamount','amount','value','price','ยอดcod','เงินปลายทาง','เก็บเงินปลายทาง','ยอดเก็บเงิน','ยอดเงิน','มูลค่า','ราคา','ยอด'],
  received:  ['received','paidamount','paid','settleamount','remitamount','paymentamount','collectedamount','actualamount','codcollected','transferamount','remit','settle','เงินเข้า','ยอดโอน','ยอดที่โอน','โอนแล้ว','จ่ายแล้ว','ยอดรับ'],
  status:    ['status','orderstatus','deliverystatus','logisticsstatus','shipmentstatus','trackingstatus','state','สถานะ','สถานะพัสดุ','สถานะการจัดส่ง','ผลการจัดส่ง'],
  shipDate:  ['shipdate','shiptime','senddate','sendtime','created','createdate','createtime','createdat','pickuptime','วันที่ส่ง','วันส่ง','วันที่สร้าง'],
  deliveredDate: ['delivereddate','deliveredtime','deliverydate','delivertime','completedate','completetime','finishtime','successdate','successtime','signtime','signedtime','receivedtime','วันที่ส่งสำเร็จ','วันส่งสำเร็จ','วันที่จัดส่งสำเร็จ','วันสำเร็จ'],
  paidDate:  ['paiddate','paidtime','paymenttime','transferdate','transfertime','settledate','settletime','remitdate','remittime','วันที่โอน','วันโอน','วันจ่าย','วันที่จ่าย','วันตัดเงิน'],
  orderId:   ['orderid','ordersn','orderno','ordernumber','ordercode','ออเดอร์','เลขออเดอร์','เลขที่ออเดอร์','เลขคำสั่งซื้อ'],
};
const norm = (s) => String(s).toLowerCase().replace(/[\s_\-.]/g, '');
// ให้คะแนนความเข้ากันระหว่าง header กับ synonym (ยิ่งตรงยิ่งสูง)
function pairScore(hn, syns) {
  let best = 0;
  for (const s of syns) {
    const sn = norm(s);
    let sc = 0;
    if (hn === sn) sc = 100;
    else if (sn.length >= 3 && (hn.startsWith(sn) || hn.endsWith(sn))) sc = 70;
    else if (sn.length >= 4 && hn.includes(sn)) sc = 45;
    else if (hn.length >= 4 && sn.includes(hn)) sc = 25;
    if (sc > best) best = sc;
  }
  return best;
}
// จับคู่แบบ global best-match: ให้คู่คะแนนสูงสุดชนะก่อน + header/field ใช้ได้ครั้งเดียว
// กันปัญหา substring ชนกัน เช่น order_sn vs order_status, delivered_time
function autoMap(headers) {
  const H = headers.map(h => ({ raw:h, n:norm(h) }));
  const pairs = [];
  for (const [field, syns] of Object.entries(SYNONYMS))
    for (const h of H) {
      const sc = pairScore(h.n, syns);
      if (sc > 0) pairs.push({ field, header: h.raw, sc });
    }
  pairs.sort((a, b) => b.sc - a.sc);
  const map = {}, usedHeader = new Set();
  for (const p of pairs) {
    if (map[p.field] || usedHeader.has(p.header)) continue;
    map[p.field] = p.header;
    usedHeader.add(p.header);
  }
  return map;
}

// ---------- normalize สถานะ ----------
function normStatus(v) {
  const s = norm(v);
  if (!s) return 'unknown';
  if (/(สำเร็จ|delivered|success|complete|signed|รับแล้ว|ปิดงาน)/.test(s)) return 'delivered';
  if (/(ตีกลับ|คืน|return|reject|ปฏิเสธ|rts|failed|ล้มเหลว|ยกเลิก|cancel)/.test(s)) return 'returned';
  if (/(กำลัง|ระหว่างทาง|transit|shipping|outfordelivery|นำจ่าย|ถึงศูนย์|pickup|รับพัสดุ)/.test(s)) return 'in_transit';
  if (/(รอ|pending|created|เตรียม|new|รอส่ง)/.test(s)) return 'pending';
  return 'unknown';
}
const STATUS_TH = { delivered:'ส่งสำเร็จ', returned:'ตีกลับ', in_transit:'กำลังจัดส่ง', pending:'รอส่ง', unknown:'ไม่ระบุ' };

// ---------- normalize 1 แถว ตาม mapping ----------
function normRow(row, map) {
  const g = (f) => (map[f] ? row[map[f]] : undefined);
  return {
    tracking: String(g('tracking') ?? '').trim(),
    carrier:  String(g('carrier') ?? '').trim() || '—',
    codAmount: parseNum(g('codAmount')),
    received:  parseNum(g('received')),
    status: normStatus(g('status')),
    statusRaw: String(g('status') ?? '').trim(),
    shipDate: g('shipDate') ?? '',
    deliveredDate: g('deliveredDate') ?? '',
    paidDate: g('paidDate') ?? '',
    orderId: String(g('orderId') ?? '').trim(),
  };
}

// ---------- reconcile: รวม 2 ฝั่งด้วยเลขพัสดุ แล้วจัดหมวด ----------
const CATS = {
  paid_ok:  { label:'เงินเข้าครบ',        color:'emerald', leak:false },
  waiting:  { label:'รอเงิน',             color:'amber',   leak:true  },
  short:    { label:'เงินเข้าไม่ครบ',      color:'red',     leak:true  },
  over:     { label:'เงินเข้าเกิน',        color:'fuchsia', leak:true  },
  returned: { label:'ตีกลับ',             color:'slate',   leak:false },
  returned_paid: { label:'ตีกลับแต่มีเงินเข้า', color:'rose', leak:true },
  orphan:   { label:'เงินเข้าไม่มีออเดอร์', color:'orange',  leak:true  },
  duplicate:{ label:'เลขพัสดุซ้ำ',         color:'violet',  leak:true  },
  in_transit:{ label:'กำลังจัดส่ง',        color:'sky',     leak:false },
  pending:  { label:'รอส่ง',              color:'slate',   leak:false },
  non_cod:  { label:'ไม่ใช่ COD',          color:'slate',   leak:false },
};

function reconcile(shipments, payments, overdueDays, tolerance) {
  const parcels = new Map(); // tracking -> parcel
  const dupCount = new Map();

  const ensure = (tracking) => {
    if (!parcels.has(tracking)) {
      parcels.set(tracking, {
        tracking, carrier:'—', expected:0, received:0, status:'unknown',
        statusRaw:'', shipDate:'', deliveredDate:'', paidDate:'', orderId:'',
        hasShipment:false, hasPayment:false,
      });
    }
    return parcels.get(tracking);
  };

  for (const r of shipments) {
    if (!r.tracking) continue;
    dupCount.set(r.tracking, (dupCount.get(r.tracking)||0) + 1);
    const p = ensure(r.tracking);
    p.hasShipment = true;
    p.carrier = r.carrier !== '—' ? r.carrier : p.carrier;
    p.expected += r.codAmount;
    p.status = r.status !== 'unknown' ? r.status : p.status;
    p.statusRaw = r.statusRaw || p.statusRaw;
    p.shipDate = r.shipDate || p.shipDate;
    p.deliveredDate = r.deliveredDate || p.deliveredDate;
    p.orderId = r.orderId || p.orderId;
    // เผื่อ feed เดียวรวมยอดเข้าไว้แล้ว
    if (r.received) { p.received += r.received; p.hasPayment = true; }
  }

  for (const r of payments) {
    if (!r.tracking) continue;
    const p = ensure(r.tracking);
    p.hasPayment = true;
    const amt = r.received || r.codAmount; // feed เงินเข้าอาจอยู่ในช่อง amount
    p.received += amt;
    if (r.carrier !== '—' && p.carrier === '—') p.carrier = r.carrier;
    p.paidDate = r.paidDate || p.paidDate;
    if (r.status !== 'unknown' && p.status === 'unknown') p.status = r.status;
  }

  const list = [];
  for (const p of parcels.values()) {
    p.isDup = (dupCount.get(p.tracking)||0) > 1;
    p.gap = round2(p.expected - p.received);      // >0 = ยังขาด, <0 = เกิน
    p.waitingDays = daysSince(p.deliveredDate) ?? daysSince(p.shipDate);

    let cat;
    if (!p.hasShipment && p.hasPayment) cat = 'orphan';
    else if (p.status === 'returned') cat = p.received > tolerance ? 'returned_paid' : 'returned';
    else if (p.expected <= 0 && p.received <= 0) cat = 'non_cod';
    else if (p.status === 'in_transit') cat = 'in_transit';
    else if (p.status === 'pending') cat = 'pending';
    else if (p.received <= tolerance) {
      // ยังไม่ได้เงิน — ถ้าสำเร็จแล้ว = รอเงิน (เป็นเป้าหมายหลักของการรั่ว)
      cat = (p.status === 'delivered' || p.deliveredDate) ? 'waiting' : 'pending';
    }
    else if (Math.abs(p.gap) <= tolerance) cat = 'paid_ok';
    else if (p.gap > tolerance) cat = 'short';
    else cat = 'over';

    p.cat = cat;
    p.overdue = cat === 'waiting' && p.waitingDays != null && p.waitingDays >= overdueDays;
    // จำนวนเงินที่ "ยังไม่เข้า/เสี่ยงหาย" ต่อพัสดุ
    p.outstanding = (cat === 'waiting') ? p.expected
                  : (cat === 'short') ? p.gap
                  : 0;
    list.push(p);
  }
  return list;
}
const round2 = (n) => Math.round((Number(n)||0) * 100) / 100;

// =========================================================================
//  UI
// =========================================================================
const LS_KEY = 'cod_checker_v1';

function App() {
  const [tab, setTab] = useState('data');
  const [shipRaw, setShipRaw] = useState([]);      // array of object (ต้นฉบับ)
  const [payRaw, setPayRaw]   = useState([]);
  const [shipMap, setShipMap] = useState({});
  const [payMap, setPayMap]   = useState({});
  const [overdueDays, setOverdueDays] = useState(7);
  const [tolerance, setTolerance] = useState(1);   // ยอมรับส่วนต่างเล็กน้อย (เศษบาท)
  const [carrierFilter, setCarrierFilter] = useState('all');
  const [sortBy, setSortBy] = useState('waiting');

  // โหลด/บันทึก
  useEffect(() => {
    try {
      const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
      if (s) {
        setShipRaw(s.shipRaw||[]); setPayRaw(s.payRaw||[]);
        setShipMap(s.shipMap||{}); setPayMap(s.payMap||{});
        setOverdueDays(s.overdueDays ?? 7); setTolerance(s.tolerance ?? 1);
        if ((s.shipRaw||[]).length) setTab('dashboard');
      }
    } catch(e){}
  }, []);
  const save = () => {
    localStorage.setItem(LS_KEY, JSON.stringify({ shipRaw, payRaw, shipMap, payMap, overdueDays, tolerance }));
    alert('บันทึกข้อมูลลงเครื่องเรียบร้อย (localStorage)');
  };
  const clearAll = () => {
    if (!confirm('ล้างข้อมูลทั้งหมด?')) return;
    setShipRaw([]); setPayRaw([]); setShipMap({}); setPayMap({});
    localStorage.removeItem(LS_KEY); setTab('data');
  };

  const shipNorm = useMemo(() => shipRaw.map(r => normRow(r, shipMap)), [shipRaw, shipMap]);
  const payNorm  = useMemo(() => payRaw.map(r => normRow(r, payMap)),   [payRaw, payMap]);
  const parcels  = useMemo(() => reconcile(shipNorm, payNorm, overdueDays, tolerance),
                           [shipNorm, payNorm, overdueDays, tolerance]);

  const carriers = useMemo(() => {
    const set = new Set(parcels.map(p => p.carrier).filter(c => c && c !== '—'));
    return ['all', ...Array.from(set).sort()];
  }, [parcels]);

  const view = useMemo(() =>
    carrierFilter === 'all' ? parcels : parcels.filter(p => p.carrier === carrierFilter),
    [parcels, carrierFilter]);

  return (
    <div className="max-w-7xl mx-auto space-y-5">
      <Header tab={tab} setTab={setTab} onSave={save} hasData={parcels.length>0} />

      {tab === 'data' && (
        <DataTab
          shipRaw={shipRaw} setShipRaw={setShipRaw} shipMap={shipMap} setShipMap={setShipMap}
          payRaw={payRaw} setPayRaw={setPayRaw} payMap={payMap} setPayMap={setPayMap}
          overdueDays={overdueDays} setOverdueDays={setOverdueDays}
          tolerance={tolerance} setTolerance={setTolerance}
          onClear={clearAll} goDash={() => setTab('dashboard')}
        />
      )}

      {tab !== 'data' && parcels.length === 0 && (
        <EmptyState onGo={() => setTab('data')} />
      )}

      {tab === 'dashboard' && parcels.length > 0 && (
        <Dashboard parcels={parcels} view={view} carriers={carriers}
          carrierFilter={carrierFilter} setCarrierFilter={setCarrierFilter}
          sortBy={sortBy} setSortBy={setSortBy} overdueDays={overdueDays}
          onOpenLeaks={() => setTab('reconcile')} />
      )}

      {tab === 'reconcile' && parcels.length > 0 && (
        <Reconcile parcels={parcels} carriers={carriers}
          carrierFilter={carrierFilter} setCarrierFilter={setCarrierFilter} />
      )}

      <p className="text-center text-xs text-slate-400 pt-2 pb-6">
        ประมวลผลในเครื่องคุณทั้งหมด — ข้อมูลไม่ถูกส่งออกไปไหน · จับคู่ด้วยเลขพัสดุ (Tracking No.)
      </p>
    </div>
  );
}

// ---------- Header ----------
function Header({ tab, setTab, onSave, hasData }) {
  const Tab = ({ id, label }) => (
    <button onClick={() => setTab(id)}
      className={clsx('px-4 py-2 rounded-lg text-sm font-semibold transition',
        tab === id ? 'bg-white text-emerald-600 shadow' : 'text-slate-500 hover:text-slate-700')}>
      {label}
    </button>
  );
  return (
    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <div className="flex items-center gap-3">
        <div className="bg-gradient-to-br from-emerald-500 to-teal-600 text-white w-11 h-11 rounded-xl grid place-items-center text-xl">💰</div>
        <div>
          <h1 className="text-xl md:text-2xl font-bold text-slate-800">ตรวจสอบเงิน COD <span className="text-xs font-normal text-slate-400">v1.0</span></h1>
          <p className="text-slate-500 text-sm">เทียบเงินที่ต้องได้ กับเงินที่เข้าจริง ทีละพัสดุ — ไม่ให้รั่วไหล</p>
        </div>
      </div>
      <div className="flex items-center gap-2">
        {hasData && <button onClick={onSave} className="px-3 py-2 text-sm rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium">💾 บันทึก</button>}
        <div className="flex bg-slate-100 p-1 rounded-xl">
          <Tab id="data" label="ข้อมูล" />
          <Tab id="dashboard" label="ภาพรวม" />
          <Tab id="reconcile" label="ตรวจรั่วไหล" />
        </div>
      </div>
    </div>
  );
}

function EmptyState({ onGo }) {
  return (
    <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-16 text-center">
      <div className="text-5xl mb-3">📥</div>
      <p className="text-slate-600 font-medium mb-1">ยังไม่มีข้อมูล</p>
      <p className="text-slate-400 text-sm mb-5">นำเข้าข้อมูลพัสดุ COD และยอดเงินเข้าก่อน แล้วระบบจะตรวจให้อัตโนมัติ</p>

// ---------- เชื่อม SPX ผ่าน proxy (server.js) — ต้องเปิดผ่าน http://localhost:PORT ----------
function SpxConnect({ onLoaded }) {
  const [from, setFrom] = useState('');
  const [to, setTo] = useState('');
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState('');
  const [health, setHealth] = useState(null);

  useEffect(() => {
    fetch('/api/health').then(r => r.json()).then(setHealth).catch(() => setHealth(null));
  }, []);

  const run = async () => {
    setLoading(true); setMsg('');
    try {
      const qs = new URLSearchParams();
      if (from) qs.set('from', from);
      if (to) qs.set('to', to);
      const res = await fetch('/api/spx/cod?' + qs.toString());
      const j = await res.json();
      if (!res.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + res.status));
      const arr = j.data || [];
      if (!arr.length) { setMsg('ดึงสำเร็จ แต่ไม่มีข้อมูลในช่วงวันที่นี้'); return; }
      const flat = arr.map(o => {
        const r = {};
        for (const k of Object.keys(o)) r[k] = (o[k] && typeof o[k] === 'object') ? JSON.stringify(o[k]) : o[k];
        return r;
      });
      onLoaded(flat);
      setMsg((j.mock ? '[MOCK] ' : '') + 'ดึงจาก SPX สำเร็จ ' + arr.length + ' รายการ → ไปแท็บ "ภาพรวม" ได้เลย');
    } catch (e) {
      setMsg('ผิดพลาด: ' + e.message + ' — ต้องเปิดหน้านี้ผ่านเซิร์ฟเวอร์ proxy (http://localhost:3000) ไม่ใช่เปิดไฟล์ .html ตรง ๆ');
    } finally { setLoading(false); }
  };

  const connected = health && health.ok;
  return (
    <div className="bg-white rounded-2xl shadow-sm border-2 border-teal-200 p-5">
      <div className="flex items-center gap-2 mb-3">
        <span className="text-xl">🚚</span>
        <h3 className="font-bold text-slate-800">เชื่อมต่อ SPX (ดึงอัตโนมัติผ่าน proxy)</h3>
        {connected
          ? <span className="ml-auto text-xs font-semibold px-2 py-1 rounded-full bg-emerald-100 text-emerald-700">
              ● เชื่อมต่อ proxy แล้ว{health.mock ? ' · MOCK' : ''}
            </span>
          : <span className="ml-auto text-xs font-semibold px-2 py-1 rounded-full bg-slate-100 text-slate-500">ยังไม่ได้เปิดผ่าน proxy</span>}
      </div>
      {!connected && (
        <p className="text-sm text-amber-700 bg-amber-50 rounded-lg px-3 py-2 mb-3">
          เปิดหน้านี้ผ่าน <b>http://localhost:3000</b> (รัน <code>node server.js</code> ก่อน) ปุ่มดึง SPX ถึงจะทำงาน
        </p>
      )}
      <div className="flex flex-wrap items-end gap-3">
        <label className="text-sm text-slate-600">ตั้งแต่วันที่
          <input type="date" value={from} onChange={e=>setFrom(e.target.value)} className="block mt-1 px-2 py-1.5 border border-slate-300 rounded-lg text-sm" />
        </label>
        <label className="text-sm text-slate-600">ถึงวันที่
          <input type="date" value={to} onChange={e=>setTo(e.target.value)} className="block mt-1 px-2 py-1.5 border border-slate-300 rounded-lg text-sm" />
        </label>
        <button onClick={run} disabled={loading || !connected}
          className="px-5 py-2 rounded-lg bg-teal-600 text-white font-semibold hover:bg-teal-700 disabled:opacity-40">
          {loading ? 'กำลังดึง…' : '⬇ ดึงข้อมูลจาก SPX'}
        </button>
      </div>
      {msg && <p className={clsx('text-sm rounded-lg px-3 py-2 mt-3', msg.includes('สำเร็จ') ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-600')}>{msg}</p>}
    </div>
  );
}

// ---------- API panel (best-effort; อาจติด CORS) ----------
function ApiPanel({ accent, onData }) {
  const [url, setUrl] = useState('');
  const [method, setMethod] = useState('GET');
  const [headers, setHeaders] = useState('{\n  "Authorization": "Bearer <TOKEN>"\n}');
  const [body, setBody] = useState('');
  const [path, setPath] = useState('data');
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState('');

  const run = async () => {
    setLoading(true); setMsg('');
    try {
      const opt = { method, headers: {} };
      try { opt.headers = JSON.parse(headers || '{}'); } catch { throw new Error('Headers ต้องเป็น JSON ที่ถูกต้อง'); }
      if (method !== 'GET' && body.trim()) { opt.body = body; opt.headers['Content-Type'] = opt.headers['Content-Type'] || 'application/json'; }
      const res = await fetch(url, opt);
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
      const json = await res.json();
      const arr = getByPath(json, path);
      if (!Array.isArray(arr)) throw new Error('path "'+path+'" ไม่ใช่ array — ลองปรับ path (เช่น data.items)');
      onData(arr);
      setMsg('ดึงสำเร็จ ' + arr.length + ' แถว');
    } catch (e) {
      setMsg('ผิดพลาด: ' + e.message + '  · ถ้าเป็น CORS/Failed to fetch เบราว์เซอร์บล็อกการเรียกตรง — ให้ export เป็น CSV แล้วอัปโหลด หรือใช้ backend/proxy ช่วยดึง');
    } finally { setLoading(false); }
  };

  return (
    <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2 text-sm">
      <div className="flex gap-2">
        <select value={method} onChange={e=>setMethod(e.target.value)} className="px-2 py-1.5 border border-slate-300 rounded-lg bg-white">
          <option>GET</option><option>POST</option>
        </select>
        <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://api.ขนส่ง.com/cod/settlements"
          className="flex-1 px-2 py-1.5 border border-slate-300 rounded-lg font-mono" />
      </div>
      <div className="grid grid-cols-2 gap-2">
        <textarea value={headers} onChange={e=>setHeaders(e.target.value)} rows={3}
          className="px-2 py-1.5 border border-slate-300 rounded-lg font-mono text-xs" placeholder="Headers (JSON)" />
        <textarea value={body} onChange={e=>setBody(e.target.value)} rows={3}
          className="px-2 py-1.5 border border-slate-300 rounded-lg font-mono text-xs" placeholder='Body (ถ้าเป็น POST)' />
      </div>
      <div className="flex items-center gap-2">
        <span className="text-slate-500">array อยู่ที่ path:</span>
        <input value={path} onChange={e=>setPath(e.target.value)} placeholder="data.items"
          className="px-2 py-1 border border-slate-300 rounded-lg font-mono w-40" />
        <button onClick={run} disabled={loading || !url}
          className="ml-auto px-4 py-1.5 rounded-lg bg-slate-800 text-white font-medium disabled:opacity-40">
          {loading ? 'กำลังดึง…' : 'ดึงข้อมูล'}
        </button>
      </div>
      {msg && <p className={clsx('text-xs rounded-lg px-2 py-1.5', msg.startsWith('ดึงสำเร็จ') ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700')}>{msg}</p>}
    </div>
  );
}

// =========================================================================
//  DASHBOARD — KPI + ตารางรายขนส่ง (แบบในรูป) + อายุหนี้เงินรอ
// =========================================================================
function Dashboard({ parcels, view, carriers, carrierFilter, setCarrierFilter, sortBy, setSortBy, overdueDays, onOpenLeaks }) {
  const k = useMemo(() => summarize(view), [view]);

  // สรุปรายขนส่ง
  const byCarrier = useMemo(() => {
    const m = new Map();
    for (const p of parcels) {
      if (!m.has(p.carrier)) m.set(p.carrier, { carrier:p.carrier, total:0, delivered:0, paidCnt:0, paidAmt:0, waitCnt:0, waitAmt:0, returnCnt:0 });
      const c = m.get(p.carrier);
      if (p.cat === 'non_cod') continue;
      c.total++;
      if (p.status === 'delivered' || p.cat==='paid_ok' || p.cat==='short' || p.cat==='waiting' || p.cat==='over') c.delivered++;
      if (p.cat === 'paid_ok' || p.cat === 'over') { c.paidCnt++; }
      c.paidAmt += Math.min(p.received, p.expected || p.received);
      if (p.cat === 'waiting') { c.waitCnt++; c.waitAmt += p.expected; }
      if (p.cat === 'short') { c.waitAmt += p.gap; }
      if (p.cat === 'returned' || p.cat === 'returned_paid') c.returnCnt++;
    }
    let arr = Array.from(m.values()).filter(c => c.carrier && c.carrier !== '—');
    arr.forEach(c => c.returnRate = c.total ? (c.returnCnt / c.total * 100) : 0);
    const sorters = {
      waiting: (a,b) => b.waitAmt - a.waitAmt,
      total:   (a,b) => b.total - a.total,
      returnRate: (a,b) => b.returnRate - a.returnRate,
      paid:    (a,b) => b.paidAmt - a.paidAmt,
    };
    arr.sort(sorters[sortBy] || sorters.waiting);
    return arr;
  }, [parcels, sortBy]);

  // อายุเงินรอ (aging)
  const aging = useMemo(() => {
    const buckets = [
      { label:'0–3 วัน', min:0, max:3, cnt:0, amt:0 },
      { label:'4–7 วัน', min:4, max:7, cnt:0, amt:0 },
      { label:'8–15 วัน', min:8, max:15, cnt:0, amt:0 },
      { label:'16–30 วัน', min:16, max:30, cnt:0, amt:0 },
      { label:'เกิน 30 วัน', min:31, max:1e9, cnt:0, amt:0 },
    ];
    for (const p of view) {
      if (p.cat !== 'waiting') continue;
      const d = p.waitingDays ?? 0;
      const b = buckets.find(b => d >= b.min && d <= b.max);
      if (b) { b.cnt++; b.amt += p.expected; }
    }
    return buckets;
  }, [view]);
  const agingMax = Math.max(1, ...aging.map(b => b.amt));

  return (
    <div className="space-y-5">
      {/* filter carriers */}
      <div className="flex flex-wrap gap-2">
        {carriers.map(c => (
          <button key={c} onClick={()=>setCarrierFilter(c)}

              carrierFilter===c ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50')}>
            {c === 'all' ? 'ทุกขนส่ง' : c}
          </button>
        ))}
      </div>

      {/* KPI */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <Kpi title="ยอด COD ที่ต้องได้" value={fmtBaht(k.expectedDelivered)} sub={`ส่งสำเร็จ ${fmtNum(k.deliveredCnt)} พัสดุ`} tone="slate" icon="📦" />
        <Kpi title="เงินเข้าแล้ว" value={fmtBaht(k.received)} sub={`${k.collectRate.toFixed(1)}% ของที่ต้องได้`} tone="emerald" icon="✅" />
        <Kpi title="รอเงิน" value={fmtBaht(k.waitingAmt)} sub={`${fmtNum(k.waitingCnt)} พัสดุ`} tone="amber" icon="⏳" />
        <Kpi title="เสี่ยงรั่วไหล" value={fmtBaht(k.leakAmt)} sub={`${fmtNum(k.leakCnt)} รายการต้องตรวจ`} tone="red" icon="🚨" onClick={onOpenLeaks} />
      </div>

      {/* แถบเตือน */}
      {k.leakCnt > 0 && (
        <button onClick={onOpenLeaks} className="w-full text-left bg-red-50 border border-red-200 rounded-2xl p-4 flex items-center gap-3 hover:bg-red-100 transition">
          <span className="text-2xl">🚨</span>
          <div className="flex-1">
            <p className="font-bold text-red-700">พบจุดเสี่ยงเงินรั่วไหล {fmtNum(k.leakCnt)} รายการ รวม {fmtBaht(k.leakAmt)}</p>
            <p className="text-sm text-red-600">
              เกินกำหนด {fmtNum(k.overdueCnt)} · เงินขาด {fmtNum(k.shortCnt)} · เงินเกิน {fmtNum(k.overCnt)} · ตีกลับมีเงินเข้า {fmtNum(k.returnedPaidCnt)} · เงินไม่มีออเดอร์ {fmtNum(k.orphanCnt)} · เลขซ้ำ {fmtNum(k.dupCnt)}
            </p>
          </div>
          <span className="text-red-600 font-semibold text-sm shrink-0">ดูรายละเอียด →</span>
        </button>
      )}

      {/* ตารางรายขนส่ง */}
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div className="p-4 border-b border-slate-100 flex flex-wrap items-center gap-3">
          <h2 className="font-bold text-slate-800">สรุปรายขนส่ง</h2>
          <div className="flex items-center gap-2 ml-auto">
            <span className="text-sm text-slate-500">เรียงตาม</span>
            <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="px-3 py-1.5 border border-slate-300 rounded-lg text-sm">
              <option value="waiting">ยอดรอเงิน</option>
              <option value="total">จำนวนพัสดุ</option>
              <option value="returnRate">อัตราตีกลับ</option>
              <option value="paid">เงินเข้าแล้ว</option>
            </select>
          </div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs uppercase">
              <tr>
                <th className="px-4 py-3 text-left">อันดับ</th>
                <th className="px-4 py-3 text-left">ขนส่ง</th>
                <th className="px-4 py-3 text-right">ส่งทั้งหมด</th>
                <th className="px-4 py-3 text-right">เงินเข้าแล้ว</th>
                <th className="px-4 py-3 text-right">รอเงิน</th>
                <th className="px-4 py-3 text-right">ตีกลับ</th>
                <th className="px-4 py-3 text-right">อัตราตีกลับ</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {byCarrier.map((c, i) => {
                const medal = ['🥇','🥈','🥉'][i] || (i+1);
                return (
                  <tr key={c.carrier} className="hover:bg-slate-50">
                    <td className="px-4 py-3 text-lg">{medal}</td>
                    <td className="px-4 py-3 font-semibold text-slate-700">{c.carrier}</td>
                    <td className="px-4 py-3 text-right num">{fmtNum(c.total)}</td>
                    <td className="px-4 py-3 text-right num text-emerald-600 font-medium">{fmtBaht(c.paidAmt)}</td>
                    <td className="px-4 py-3 text-right num">
                      <span className={clsx('font-semibold', c.waitCnt>0 ? 'text-amber-600' : 'text-slate-400')}>{fmtNum(c.waitCnt)}</span>
                      {c.waitAmt>0 && <div className="text-xs text-amber-500">{fmtBaht(c.waitAmt)}</div>}
                    </td>
                    <td className="px-4 py-3 text-right num text-slate-500">{fmtNum(c.returnCnt)}</td>
                    <td className="px-4 py-3 text-right">
                      <span className={clsx('inline-block px-2 py-0.5 rounded-full text-xs font-semibold',
                        c.returnRate > 15 ? 'bg-red-100 text-red-700' : c.returnRate > 5 ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700')}>
                        {c.returnRate.toFixed(1)}%
                      </span>
                    </td>
                  </tr>
                );
              })}
              {byCarrier.length === 0 && <tr><td colSpan={7} className="px-4 py-10 text-center text-slate-400">ไม่มีข้อมูลขนส่ง</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {/* Aging เงินรอ */}
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <h2 className="font-bold text-slate-800 mb-1">อายุของเงินที่รอเข้า (Aging)</h2>
        <p className="text-sm text-slate-500 mb-4">ยิ่งรอนาน ยิ่งเสี่ยงหาย — เกินกำหนด {overdueDays} วันควรทวงถามขนส่งทันที</p>
        <div className="space-y-2.5">
          {aging.map(b => (
            <div key={b.label} className="flex items-center gap-3">
              <span className="w-24 text-sm text-slate-600 shrink-0">{b.label}</span>
              <div className="flex-1 bg-slate-100 rounded-full h-6 overflow-hidden">
                <div className={clsx('h-full rounded-full flex items-center justify-end px-2', b.min>7 ? 'bg-red-400' : b.min>3 ? 'bg-amber-400' : 'bg-emerald-400')}
                  style={{ width: Math.max(3, b.amt/agingMax*100) + '%' }}>
                  {b.amt>0 && <span className="text-xs text-white font-semibold whitespace-nowrap num">{fmtBaht(b.amt)}</span>}
                </div>
              </div>
              <span className="w-16 text-right text-sm text-slate-500 num shrink-0">{fmtNum(b.cnt)} ชิ้น</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function summarize(list) {
  const s = {
    deliveredCnt:0, expectedDelivered:0, received:0,
    waitingCnt:0, waitingAmt:0, shortCnt:0, shortAmt:0, overCnt:0, overAmt:0,
    overdueCnt:0, returnedPaidCnt:0, orphanCnt:0, dupCnt:0,
    leakCnt:0, leakAmt:0, collectRate:0,
  };
  const dupSeen = new Set();
  for (const p of list) {
    if (p.status === 'delivered' || ['paid_ok','short','waiting','over'].includes(p.cat)) {
      s.deliveredCnt++; s.expectedDelivered += p.expected;
    }
    s.received += (p.cat==='non_cod') ? 0 : p.received;
    if (p.cat === 'waiting') { s.waitingCnt++; s.waitingAmt += p.expected; if (p.overdue) s.overdueCnt++; }
    if (p.cat === 'short')   { s.shortCnt++; s.shortAmt += p.gap; }
    if (p.cat === 'over')    { s.overCnt++; s.overAmt += -p.gap; }
    if (p.cat === 'returned_paid') s.returnedPaidCnt++;
    if (p.cat === 'orphan')  s.orphanCnt++;
    if (p.isDup && !dupSeen.has(p.tracking)) { dupSeen.add(p.tracking); s.dupCnt++; }
  }
  // เสี่ยงรั่วไหล = เงินขาด + เงินเกิน + ตีกลับมีเงิน + orphan + เลขซ้ำ + เฉพาะรอเงิน "เกินกำหนด"
  s.leakCnt = s.shortCnt + s.overCnt + s.returnedPaidCnt + s.orphanCnt + s.dupCnt + s.overdueCnt;
  s.leakAmt = s.shortAmt + s.overAmt;
  // นับยอดเงินของรอเงินเกินกำหนดเข้าไปในยอดเสี่ยงด้วย
  for (const p of list) if (p.cat==='waiting' && p.overdue) s.leakAmt += p.expected;
  s.collectRate = s.expectedDelivered > 0 ? (s.received / s.expectedDelivered * 100) : 0;
  return s;
}

function Kpi({ title, value, sub, tone, icon, onClick }) {
  const tones = {
    slate:'text-slate-700', emerald:'text-emerald-600', amber:'text-amber-600', red:'text-red-600',
  };
  return (
    <div onClick={onClick}
      className={clsx('bg-white p-4 rounded-2xl shadow-sm border border-slate-200', onClick && 'cursor-pointer hover:shadow-md transition')}>
      <div className="flex items-center justify-between">
        <p className="text-sm text-slate-500 font-medium">{title}</p>
        <span className="text-lg">{icon}</span>
      </div>
      <p className={clsx('text-2xl font-bold mt-1 num', tones[tone])}>{value}</p>
      <p className="text-xs text-slate-400 mt-0.5">{sub}</p>
    </div>
  );
}

// =========================================================================
//  RECONCILE — ตารางจับทุกจุดรั่ว + ฟิลเตอร์ + ค้นหา + export
// =========================================================================
const FILTER_TABS = [
  { id:'leak', label:'⚠️ เฉพาะที่ต้องตรวจ' },
  { id:'waiting', label:'รอเงิน' },
  { id:'short', label:'เงินขาด' },
  { id:'over', label:'เงินเกิน' },
  { id:'returned_paid', label:'ตีกลับมีเงิน' },
  { id:'orphan', label:'ไม่มีออเดอร์' },
  { id:'duplicate', label:'เลขซ้ำ' },
  { id:'paid_ok', label:'ครบแล้ว' },
  { id:'all', label:'ทั้งหมด' },
];

function Reconcile({ parcels, carriers, carrierFilter, setCarrierFilter }) {
  const [f, setF] = useState('leak');
  const [q, setQ] = useState('');

  const rows = useMemo(() => {
    let r = parcels;
    if (carrierFilter !== 'all') r = r.filter(p => p.carrier === carrierFilter);
    if (f === 'leak') r = r.filter(p => CATS[p.cat]?.leak || p.isDup);
    else if (f === 'duplicate') r = r.filter(p => p.isDup);
    else if (f !== 'all') r = r.filter(p => p.cat === f);
    if (q.trim()) {
      const s = q.trim().toLowerCase();
      r = r.filter(p => p.tracking.toLowerCase().includes(s) || (p.orderId||'').toLowerCase().includes(s));
    }
    // เรียง: เงินที่ค้าง/ผิดปกติมากก่อน
    return [...r].sort((a,b) => (Math.abs(b.outstanding)||Math.abs(b.gap)) - (Math.abs(a.outstanding)||Math.abs(a.gap)));
  }, [parcels, carrierFilter, f, q]);

  const exportCSV = () => {
    const head = ['tracking','order','carrier','status','category','expected','received','gap','waiting_days'];
    const lines = [head.join(',')];
    for (const p of rows) {
      lines.push([p.tracking, p.orderId, p.carrier, STATUS_TH[p.status], CATS[p.cat]?.label || p.cat,
        p.expected, p.received, p.gap, p.waitingDays ?? ''].map(x => `"${String(x??'').replace(/"/g,'""')}"`).join(','));
    }
    const blob = new Blob(['﻿' + lines.join('\n')], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'cod-leaks.csv'; a.click();
    URL.revokeObjectURL(a.href);
  };

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3">
        <div className="flex flex-wrap gap-2">
          {FILTER_TABS.map(t => (
            <button key={t.id} onClick={()=>setF(t.id)}
              className={clsx('px-3 py-1.5 rounded-lg text-sm font-medium transition',
                f===t.id ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200')}>
              {t.label}
            </button>
          ))}
        </div>
        <div className="flex flex-wrap gap-2 items-center">
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหาเลขพัสดุ / ออเดอร์…"
            className="flex-1 min-w-[200px] px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          <select value={carrierFilter} onChange={e=>setCarrierFilter(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-lg text-sm">
            {carriers.map(c => <option key={c} value={c}>{c==='all'?'ทุกขนส่ง':c}</option>)}
          </select>
          <span className="text-sm text-slate-500">พบ {fmtNum(rows.length)} รายการ</span>
          <button onClick={exportCSV} className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold">⬇ Export CSV</button>
        </div>
      </div>

      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs uppercase">
              <tr>
                <th className="px-4 py-3 text-left">เลขพัสดุ / ออเดอร์</th>
                <th className="px-4 py-3 text-left">ขนส่ง</th>
                <th className="px-4 py-3 text-left">สถานะ</th>
                <th className="px-4 py-3 text-right">ต้องได้</th>
                <th className="px-4 py-3 text-right">เข้าจริง</th>
                <th className="px-4 py-3 text-right">ส่วนต่าง</th>
                <th className="px-4 py-3 text-center">ค้าง(วัน)</th>
                <th className="px-4 py-3 text-left">ผลตรวจ</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {rows.map((p, i) => {
                const cat = CATS[p.cat] || {};
                return (
                  <tr key={p.tracking+i} className="hover:bg-slate-50">
                    <td className="px-4 py-3">
                      <div className="font-mono text-slate-700">{p.tracking}</div>
                      {p.orderId && <div className="text-xs text-slate-400">{p.orderId}</div>}
                    </td>
                    <td className="px-4 py-3 text-slate-600">{p.carrier}</td>
                    <td className="px-4 py-3 text-slate-500 text-xs">{STATUS_TH[p.status]}</td>
                    <td className="px-4 py-3 text-right num text-slate-700">{p.expected? fmtBaht(p.expected):'—'}</td>
                    <td className="px-4 py-3 text-right num text-slate-700">{p.received? fmtBaht(p.received):'—'}</td>
                    <td className={clsx('px-4 py-3 text-right num font-semibold', p.gap>0?'text-red-600':p.gap<0?'text-fuchsia-600':'text-slate-300')}>
                      {p.gap? fmtBaht(p.gap):'0'}
                    </td>
                    <td className="px-4 py-3 text-center num">
                      {p.cat==='waiting'
                        ? <span className={clsx('font-semibold', p.overdue?'text-red-600':'text-amber-500')}>{p.waitingDays ?? '—'}{p.overdue?'!':''}</span>
                        : <span className="text-slate-300">—</span>}
                    </td>
                    <td className="px-4 py-3">
                      <span className={clsx('inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap',
                        badgeCls(cat.color))}>
                        {cat.label || p.cat}{p.isDup && p.cat!=='duplicate' ? ' · ซ้ำ' : ''}
                      </span>
                    </td>
                  </tr>
                );
              })}
              {rows.length === 0 && <tr><td colSpan={8} className="px-4 py-12 text-center text-slate-400">🎉 ไม่พบรายการในเงื่อนไขนี้</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function badgeCls(color) {
  const m = {
    emerald:'bg-emerald-100 text-emerald-700', amber:'bg-amber-100 text-amber-700',
    red:'bg-red-100 text-red-700', fuchsia:'bg-fuchsia-100 text-fuchsia-700',
    slate:'bg-slate-100 text-slate-600', rose:'bg-rose-100 text-rose-700',
    orange:'bg-orange-100 text-orange-700', violet:'bg-violet-100 text-violet-700',
    sky:'bg-sky-100 text-sky-700',
  };
  return m[color] || m.slate;
}

</script>
