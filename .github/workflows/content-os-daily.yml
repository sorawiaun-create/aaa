name: Content OS — รายงานเช้า

# ตื่นทำงานเองทุกเช้า 6:00 น. (เวลาไทย) แล้ว commit content-os/data.json กลับเข้า repo
# หน้า content-os/index.html จะอ่านไฟล์นี้ตอนเปิดผ่าน http(s)
on:
  schedule:
    # cron ของ GitHub เป็น UTC — 23:00 UTC = 06:00 น. ของเช้าวันถัดไปในไทย (UTC+7)
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: content-os-daily
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: content-os/requirements.txt

      - name: Install dependencies
        run: pip install -r content-os/requirements.txt

      - name: Build data.json
        env:
          # ใช้ token ตัวเดียวกับ Facebook Ads Automation ได้เลย
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          # ไม่ตั้งค่าไหน = ข้ามส่วนนั้น หน้าเว็บจะใช้ข้อมูลตัวอย่างของส่วนนั้นต่อไป
          FB_AD_ACCOUNT_ID: ${{ secrets.FB_AD_ACCOUNT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LOG_LEVEL: INFO
        run: python content-os/scripts/build_data.py

      - name: Commit data.json
        run: |
          if [ ! -f content-os/data.json ]; then
            echo "ไม่มีไฟล์ data.json (ยังไม่ได้ตั้ง secrets) — ข้ามการ commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-os/data.json
          if git diff --cached --quiet; then
            echo "ข้อมูลไม่เปลี่ยน"
            exit 0
          fi
          git commit -m "chore(content-os): รายงานเช้า [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main \
              && git push origin HEAD:main && break
            echo "push retry $i"; sleep 3
          done
