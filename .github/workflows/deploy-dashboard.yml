name: Deploy dashboard (Pages)

# เอาหน้าเว็บ (docs/) ขึ้น GitHub Pages "เฉพาะตอนแก้โค้ดหน้าเว็บจริง ๆ" เท่านั้น
# แยกออกจากการ commit ไฟล์ข้อมูล (status/activity/board) ที่เกิดทุกรอบรัน
# -> หน้าเว็บจะอัปเดตเร็ว เชื่อถือได้ ไม่โดนไฟล์ข้อมูลมาสั่งสร้างทับจนไม่เสร็จ
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# รอบ deploy ใหม่เขี่ยรอบเก่าที่ค้างทิ้ง (กันกรณี Pages deploy ค้าง "waiting" แล้วบล็อกคิว)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
