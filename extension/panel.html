<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <style>
    :root { --teal:#12a594; --teal-d:#0e8a7c; --bg:#f4f6f7; --card:#fff; --border:#e3e8ea; --text:#1a2b2a; --muted:#7a8a89; --green:#16b364; --red:#e5484d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI","Sarabun",sans-serif; background:var(--bg); color:var(--text); font-size:13px; }
    header { background:var(--teal); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:3; }
    header .back { cursor:pointer; opacity:.9; font-weight:600; }
    header h1 { font-size:15px; margin:0; font-weight:700; }
    .app { padding:12px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    label { font-size:12px; color:var(--muted); }
    input, select { background:#fff; border:1px solid var(--border); border-radius:8px; padding:7px 9px; color:var(--text); font-size:13px; }
    input[type=number]{ width:88px; text-align:right; }
    button { border:none; border-radius:9px; padding:9px 12px; font-size:13px; font-weight:700; cursor:pointer; }
    .primary { background:var(--teal); color:#fff; width:100%; }
    .ghost { background:#eef2f2; color:var(--text); }
    .switch { position:relative; width:44px; height:25px; flex:none; }
    .switch input { display:none; }
    .slider { position:absolute; inset:0; background:#cfd8d7; border-radius:999px; transition:.2s; }
    .slider:before { content:""; position:absolute; height:19px; width:19px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
    input:checked + .slider { background:var(--green); }
    input:checked + .slider:before { transform:translateX(19px); }
    .muted { color:var(--muted); font-size:11px; line-height:1.5; }
    .sec { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:14px 2px 8px; }
    .chan { display:flex; align-items:center; gap:10px; padding:11px 12px; background:#fff; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer; }
    .chan:hover { border-color:var(--teal); }
    .av { width:34px; height:34px; border-radius:50%; background:#dfeceb; flex:none; overflow:hidden; display:grid; place-items:center; font-weight:700; color:var(--teal); }
    .av img { width:100%; height:100%; object-fit:cover; }
    .chan .nm { font-weight:600; font-size:13px; }
    .chan .id { color:var(--muted); font-size:11px; }
    .chev { margin-left:auto; color:#bcc7c6; }
    .addbtn { border:1px dashed var(--teal); color:var(--teal); background:#f2fbfa; border-radius:12px; padding:12px; text-align:center; font-weight:700; cursor:pointer; }
    .note { background:#eef7f6; border:1px solid #cfe9e5; border-radius:10px; padding:10px; font-size:11px; color:#2b615b; margin-bottom:10px; }
    .trigger { border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; }
    .tabs { display:flex; gap:4px; background:#eef2f2; border-radius:9px; padding:3px; margin:6px 0; }
    .tabs button { flex:1; background:transparent; color:var(--muted); padding:6px; font-size:12px; }
    .tabs button.on { background:var(--teal); color:#fff; }
    .msg { font-size:12px; color:var(--teal); min-height:16px; margin-top:6px; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; margin-right:6px; }
    .search { width:100%; margin-bottom:10px; }
    .pill { padding:1px 7px; border-radius:6px; font-size:10px; font-weight:700; }
    footer { padding:8px 14px; color:var(--muted); font-size:10px; border-top:1px solid var(--border); }
    a { color:var(--teal); }
  </style>
</head>
<body>
  <header>
    <span class="back" id="back" style="display:none">‹ กลับ</span>
    <h1 id="title">GMV Max Monitor</h1>
    <span id="headRight" style="margin-left:auto"></span>
  </header>
  <div class="app" id="app"></div>
  <footer id="foot">● พร้อมทำงาน</footer>
  <script src="panel.js"></script>
</body>
</html>
